<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload MRI - BraTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
                        url('https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .navbar {
            background: rgba(0,0,0,0.6) !important;
            backdrop-filter: blur(10px);
        }

        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .upload-box {
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #0d6efd;
            background: rgba(13,110,253,0.1);
        }

        .btn-medical {
            background: linear-gradient(45deg, #0d6efd, #00c6ff);
            border: none;
            color: white;
            font-weight: bold;
        }

        .file-name {
            font-size: 14px;
            margin-top: 5px;
            color: #00c6ff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="fa-solid fa-brain me-2"></i>BraTS AI Diagnostics
            </a>
            <div>
                <span class="me-3">Dr. {{ session['username'] }}</span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Log Out</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h3 class="fw-bold mb-4">
                <i class="fa-solid fa-upload text-info me-2"></i>
                Upload Patient MRI Scans
            </h3>

            <form action="/predict" method="post" enctype="multipart/form-data" id="uploadForm">
                <div class="row g-4">

                    <div class="col-md-6">
                        <div class="upload-box">
                            <i class="fa-solid fa-file-waveform fa-2x mb-2"></i>
                            <h5>T1 Scan</h5>
                            <input class="form-control mt-2" type="file" name="t1_file" required onchange="showFileName(this, 't1_name')">
                            <div id="t1_name" class="file-name"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="upload-box">
                            <i class="fa-solid fa-file-waveform fa-2x mb-2"></i>
                            <h5>T1ce Scan</h5>
                            <input class="form-control mt-2" type="file" name="t1ce_file" required onchange="showFileName(this, 't1ce_name')">
                            <div id="t1ce_name" class="file-name"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="upload-box">
                            <i class="fa-solid fa-file-waveform fa-2x mb-2"></i>
                            <h5>T2 Scan</h5>
                            <input class="form-control mt-2" type="file" name="t2_file" required onchange="showFileName(this, 't2_name')">
                            <div id="t2_name" class="file-name"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="upload-box">
                            <i class="fa-solid fa-file-waveform fa-2x mb-2"></i>
                            <h5>FLAIR Scan</h5>
                            <input class="form-control mt-2" type="file" name="flair_file" required onchange="showFileName(this, 'flair_name')">
                            <div id="flair_name" class="file-name"></div>
                        </div>
                    </div>

                </div>

                <div class="text-center mt-4" id="submitArea">
                    <button type="submit" class="btn btn-medical btn-lg px-5">
                        <i class="fa-solid fa-microchip me-2"></i>
                        Run AI Segmentation
                    </button>
                </div>

                <div class="text-center mt-4 d-none" id="loadingArea">
                    <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
                    <h5 class="mt-3 text-info">AI Model Processing MRI... Please wait</h5>
                </div>

            </form>
        </div>
    </div>

    <script>
        function showFileName(input, id) {
            document.getElementById(id).innerText = input.files[0].name;
        }

        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('submitArea').classList.add('d-none');
            document.getElementById('loadingArea').classList.remove('d-none');
        });
    </script>

</body>
</html>
