<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BraTS AI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
                        url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .glass-card {
            margin-top: 80px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            color: white;
        }

        .btn-medical {
            background: linear-gradient(45deg, #0d6efd, #00c6ff);
            border: none;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-medical:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #0d6efd;
        }

        .fa-brain {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card text-center">
                    <i class="fa-solid fa-brain fa-4x text-info mb-3"></i>
                    <h2 class="fw-bold mb-1">BraTS Portal</h2>
                    <p class="text-light mb-4">Clinical Neuroimaging AI System</p>
                    
                    <form action="/login" method="post">
                        <div class="form-floating mb-3 text-dark">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Doctor ID" required>
                            <label for="username"><i class="fa-solid fa-user-md me-2"></i>Doctor ID</label>
                        </div>

                        <div class="form-floating mb-4 text-dark">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password"><i class="fa-solid fa-lock me-2"></i>Password</label>
                        </div>

                        <button type="submit" class="btn btn-medical w-100 mb-3">Secure Login</button>
                        <small class="text-light">Demo Credentials: admin / pass</small>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 BraTS AI | Brain Tumor Detection System
    </footer>
</body>
</html>
