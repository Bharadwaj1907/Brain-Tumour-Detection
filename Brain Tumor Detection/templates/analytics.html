<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analytics - BraTS AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
                        url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        .navbar {
            background: rgba(0,0,0,0.6) !important;
            backdrop-filter: blur(10px);
        }

        .glass-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        canvas {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
        }

        .btn-medical {
            background: linear-gradient(45deg, #0d6efd, #00c6ff);
            border: none;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">
                <i class="fa-solid fa-brain me-2"></i>BraTS AI Diagnostics
            </a>

            <div>
                <span class="me-3">Dr. {{ session['username'] }}</span>
                <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Log Out</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">

        <h2 class="fw-bold mb-4">
            <i class="fa-solid fa-chart-line text-info me-2"></i>
            Clinical Analytics Dashboard
        </h2>

        <!-- Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h5>Total Scans</h5>
                    <h2 class="text-info">{{ total_scans }}</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <h5>Tumor Detected</h5>
                    <h2 class="text-danger">{{ tumor_cases }}</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <h5>No Tumor</h5>
                    <h2 class="text-success">{{ no_tumor_cases }}</h2>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card">
                    <h5>Doctors Using System</h5>
                    <h2 class="text-warning">{{ doctors }}</h2>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-4">
            <div class="col-md-6">
                <div class="glass-card">
                    <h5 class="mb-3">Tumor Type Distribution</h5>
                    <canvas id="tumorChart"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="glass-card">
                    <h5 class="mb-3">Tumor Volume Trend</h5>
                    <canvas id="volumeChart"></canvas>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Tumor Type Pie Chart
        var ctx1 = document.getElementById('tumorChart').getContext('2d');
        var tumorChart = new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: ['Necrotic Core', 'Edema', 'Enhancing Tumor'],
                datasets: [{
                    data: [{{ necrotic }}, {{ edema }}, {{ enhancing }}],
                    backgroundColor: ['#0d6efd', '#ffc107', '#dc3545']
                }]
            }
        });

        // Tumor Volume Line Chart
        var ctx2 = document.getElementById('volumeChart').getContext('2d');
        var volumeChart = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: {{ dates|safe }},
                datasets: [{
                    label: 'Tumor Volume',
                    data: {{ volumes|safe }},
                    borderColor: '#00c6ff',
                    fill: false
                }]
            }
        });
    </script>

</body>
</html>
